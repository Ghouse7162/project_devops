
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missing Item | QuickCart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav aria-label="Main navigation">
            <a class="brand" href="index.html">Quick<span>Cart</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="track-order.html">Track Order</a>
                <a href="returns.html">Returns</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <span class="eyebrow">We're here to help</span>
            <h1>Is an item missing?</h1>
            <p>Tell us about your order so we can guide you through the next steps.</p>
        </section>

        <section class="support-section">
            <div class="support-card">
                <h2>Missing item details</h2>

                <form id="missing-form">
                    <label for="order-id">Order number</label>
                    <input
                        type="text"
                        id="order-id"
                        placeholder="Example: QC12345"
                        required
                    >

                    <label for="item-name">Missing item</label>
                    <input
                        type="text"
                        id="item-name"
                        placeholder="Enter the item name"
                        required
                    >

                    <label for="details">Additional details</label>
                    <textarea
                        id="details"
                        placeholder="Describe what was missing (optional)"
                        rows="4"
                    ></textarea>

                    <button class="button" type="submit">Submit details</button>
                </form>

                <p id="form-result" role="status"></p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 QuickCart Support Portal · Built as a cloud learning project</p>
    </footer>

    <script>
        document.getElementById("missing-form").addEventListener("submit", function(event) {
            event.preventDefault();

            const orderId = document.getElementById("order-id").value.trim();
            const itemName = document.getElementById("item-name").value.trim();
            const result = document.getElementById("form-result");

            result.textContent =
                "Demo only: Your report for '" + itemName +
                "' on order " + orderId +
                " has been prepared. It has not been sent to a support team.";
        });
    </script>
</body>
</html>
